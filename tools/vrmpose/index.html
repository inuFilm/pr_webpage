<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101418">
<title>VRM Pose Ref</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "@pixiv/three-vrm": "./vendor/three-vrm.module.min.js"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>

<header id="topbar">
  <button id="btnScenes" class="tb" data-tip="シーンの保存・読み込み。.json ファイルへの書き出し/取り込みもここから">シーン</button>
  <button id="btnAddModel" class="tb" data-tip="VRM形式(キャラクター)または glTF/GLB形式(小物)を読み込みます">＋モデル</button>
  <button id="btnPose" class="tb" data-tip="ポーズプリセット・手の形・目線・表情の調整">ポーズ</button>
  <button id="btnCamera" class="tb" data-tip="FOV・平行投影・アスペクト比(構図ガイド)・書き出し解像度">カメラ</button>
  <button id="btnExport" class="tb" data-tip="静止画(PNG)を書き出します。比率・解像度は「カメラ」、透過背景は⚙で設定">PNG書き出し</button>
  <button id="btnSettings" class="tb icon" data-tip="背景・表示・メニュー位置・キャラクター管理">⚙</button>
  <span class="spacer"></span>
  <button id="modeIllust" class="tb mode active" data-tip="1枚絵のポーズ資料モード(通常)">イラスト</button>
  <button id="modeConte" class="tb mode" data-tip="タイムラインでカットを並べ、連番PNGで書き出す絵コンテモード(実験的機能・調整中)">コンテ(実験的機能)</button>
  <button id="btnUndo" class="tb icon" data-tip="元に戻す">↶</button>
  <button id="btnRedo" class="tb icon" data-tip="やり直す">↷</button>
</header>

<div id="charbar"></div>

<!-- シーンパネル -->
<aside id="panelScenes" class="panel hidden">
  <div class="panel-head"><h3>シーン</h3><button class="close" data-close>✕</button></div>
  <div class="row">
    <input id="sceneName" type="text" placeholder="シーン名" autocomplete="off">
    <button id="btnSaveScene">保存</button>
  </div>
  <ul id="sceneList" class="list"></ul>
  <hr>
  <button id="btnExportScene" class="wide">ファイルへ書き出し (.json)</button>
  <button id="btnImportScene" class="wide">ファイルから読み込み</button>
  <p class="note">シーンにはポーズ・カメラ・背景設定が含まれます。モデル本体は含まれないので、別端末ではモデルを読み込み直すと復元されます。</p>
</aside>

<!-- ポーズ・表情パネル -->
<aside id="panelPose" class="panel hidden">
  <div class="panel-head"><h3 id="poseTargetName">ポーズ・表情</h3><button class="close" data-close>✕</button></div>

  <h4>ポーズ</h4>
  <div class="btn-row">
    <button data-pose="stand">立ち</button>
    <button data-pose="sit">座り</button>
    <button data-pose="tpose">Tポーズ</button>
  </div>

  <h4>手</h4>
  <div class="btn-row hand-row">左手
    <button data-hand="left" data-handpose="グー">グー</button>
    <button data-hand="left" data-handpose="チョキ">チョキ</button>
    <button data-hand="left" data-handpose="パー">パー</button>
    <button data-hand="left" data-handpose="指差し">指差し</button>
    <button data-hand="left" data-handpose="グッジョブ">👍</button>
  </div>
  <div class="btn-row hand-row">右手
    <button data-hand="right" data-handpose="グー">グー</button>
    <button data-hand="right" data-handpose="チョキ">チョキ</button>
    <button data-hand="right" data-handpose="パー">パー</button>
    <button data-hand="right" data-handpose="指差し">指差し</button>
    <button data-hand="right" data-handpose="グッジョブ">👍</button>
  </div>

  <h4>目線</h4>
  <label class="check-row"><input id="gazeCamera" type="checkbox"> カメラ目線</label>
  <label class="jog-row">左右<input id="gazeYaw" type="range" min="-60" max="60" step="1" value="0"><span class="val" id="valGazeYaw">0°</span></label>
  <label class="jog-row">上下<input id="gazePitch" type="range" min="-40" max="40" step="1" value="0"><span class="val" id="valGazePitch">0°</span></label>
  <button id="btnGazeReset" class="wide small">目線を正面に戻す</button>

  <h4>表情</h4>
  <div id="expressionList"></div>
  <button id="btnExpReset" class="wide small">表情をリセット</button>
</aside>

<!-- カメラパネル -->
<aside id="panelCamera" class="panel hidden">
  <div class="panel-head"><h3>カメラ</h3><button class="close" data-close>✕</button></div>
  <label class="slider-row">FOV <span id="fovVal">30</span>°(<span id="fovMm">45</span>mm)
    <input id="fovRange" type="range" min="10" max="120" step="1" value="30">
  </label>
  <label class="check-row"><input id="orthoToggle" type="checkbox"> 平行投影</label>
  <label class="check-row">アスペクト比
    <select id="aspectSelect">
      <option value="free" selected>画面のまま</option>
      <option value="1:1">1:1</option>
      <option value="4:3">4:3</option>
      <option value="3:4">3:4</option>
      <option value="3:2">3:2</option>
      <option value="2:3">2:3</option>
      <option value="16:9">16:9</option>
      <option value="9:16">9:16</option>
      <option value="2:1">2:1</option>
      <option value="1:2">1:2</option>
    </select>
  </label>
  <label class="check-row">書き出し長辺
    <input id="exportLong" type="number" min="256" max="8192" step="64" value="2048" inputmode="numeric"> px
  </label>
  <div class="note" id="exportDims"></div>
</aside>

<!-- 設定パネル -->
<aside id="panelSettings" class="panel hidden">
  <div class="panel-head"><h3>設定</h3><button class="close" data-close>✕</button></div>

  <h4>背景</h4>
  <label class="check-row">背景色 <input id="bgColor" type="color" value="#3a3f47"></label>
  <label class="check-row"><input id="alphaToggle" type="checkbox"> PNGを透過背景にする</label>

  <h4>メニュー</h4>
  <label class="check-row">表示位置
    <select id="panelSideSelect">
      <option value="left" selected>左寄せ</option>
      <option value="right">右寄せ</option>
    </select>
  </label>

  <h4>表示</h4>
  <label class="check-row"><input id="handleToggle" type="checkbox" checked> 操作ハンドルを表示</label>
  <label class="check-row"><input id="gridToggle" type="checkbox" checked> 床グリッドを表示</label>
  <label class="check-row"><input id="eyeLevelToggle" type="checkbox" checked> アイレベルを表示</label>
  <label class="slider-row">ハンドルサイズ
    <input id="handleSize" type="range" min="0.5" max="2" step="0.1" value="1">
  </label>

  <h4>キャラクター</h4>
  <ul id="charList" class="list"></ul>
  <p class="note">ポーズはモデルをまたいで共通形式で保存されるので、素体を差し替えても使い回せます。</p>
</aside>

<!-- ボーン操作パネル -->
<div id="bonePanel" class="hidden">
  <div id="boneTitle">ボーン</div>
  <label class="jog-row">ひねり<input id="jogTwist" type="range" min="-180" max="180" step="1" value="0"><span class="val" id="valTwist">0°</span></label>
  <label class="jog-row">縦回転<input id="jogPitch" type="range" min="-89" max="89" step="1" value="0"><span class="val" id="valPitch">0°</span></label>
  <label class="jog-row">横回転<input id="jogYaw" type="range" min="-180" max="180" step="1" value="0"><span class="val" id="valYaw">0°</span></label>
  <label class="jog-row curl-only">指を握る<input id="curlSlider" type="range" min="0" max="1" step="0.01" value="0"><span class="val" id="valCurl">0</span></label>
  <label class="jog-row curl-only">指を開く<input id="spreadSlider" type="range" min="-1" max="1" step="0.01" value="0"><span class="val" id="valSpread">0</span></label>
  <label class="jog-row scale-only">大きさ<input id="propScale" type="range" min="0.05" max="4" step="0.05" value="1"><span class="val" id="valScale">1.0</span></label>
  <button id="btnDeselect" class="wide small">選択解除</button>
</div>

<!-- コンテモードのタイムライン -->
<div id="conteBar" class="hidden">
  <div class="conte-controls">
    <button id="cutAdd" data-tip="現在のポーズ・カメラ・小物配置をカットとして追加">＋カット</button>
    <button id="cutUpdate" data-tip="選択中のカットを現在の状態で上書き">上書き</button>
    <button id="cutDelete" data-tip="選択中のカットを削除">削除</button>
    <button id="cutLeft" data-tip="カットを左へ移動">◀</button>
    <button id="cutRight" data-tip="カットを右へ移動">▶</button>
    <label>fps
      <select id="conteFps"><option value="24" selected>24</option><option value="30">30</option></select>
    </label>
    <label>長辺
      <input id="conteLong" type="number" min="256" max="4096" step="32" value="960" inputmode="numeric">
    </label>
    <button id="contePlay" data-tip="タイムラインを実時間で再生">▶ 再生</button>
    <button id="conteExport" data-tip="全フレームを連番PNG(zip)で書き出し。ホールド分も複製されるので編集ソフトでそのままタイミング確認できます">連番書き出し</button>
    <span id="conteInfo"></span>
  </div>
  <div id="cutList"></div>
</div>

<div id="frameGuide" class="hidden"></div>
<div id="eyeLine" class="hidden"><span id="eyeLineLabel"></span></div>
<div id="tooltip" class="hidden"></div>
<div id="toast" class="hidden"></div>
<div id="loading" class="hidden"><div class="spin"></div>読み込み中…</div>

<input type="file" id="fileModel" hidden>
<input type="file" id="fileScene" hidden accept=".json,application/json">

<script type="module" src="./js/app.js"></script>
</body>
</html>
